version: 2
project_name: voom
before:
  hooks:
    - go mod tidy
    - scripts/prepare-gvproxy-release.sh
builds:
  - id: voom
    main: ./cmd/voom
    binary: voom
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/mjrusso/voom/internal/cli.version={{.Version}} -X github.com/mjrusso/voom/internal/cli.commit={{.Commit}} -X github.com/mjrusso/voom/internal/cli.date={{.Date}}
  - id: gvproxy
    dir: .release/gvproxy
    main: ./cmd/gvproxy
    binary: gvproxy
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
archives:
  - formats: [tar.gz]
    ids:
      - voom
      - gvproxy
    name_template: >-
      {{ .ProjectName }}_{{ .Os }}_{{ if eq .Arch "amd64" }}x64{{ else }}{{ .Arch }}{{ end }}
    files:
      - LICENSE
      - src: .release/gvproxy/LICENSE
        dst: LICENSE.gvproxy
      - src: nix/NOTICE.gvproxy
        dst: NOTICE.gvproxy
      - src: .release/gvproxy-licenses/{{ .Os }}_{{ .Arch }}/**/*
        dst: THIRD_PARTY_LICENSES
      - README.md
      - CHANGELOG.md
checksum:
  name_template: checksums.txt
snapshot:
  version_template: "{{ incpatch .Version }}-next"
release:
  github:
    owner: mjrusso
    name: voom
