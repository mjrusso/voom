version: 2
project_name: voom
before:
  hooks:
    - go mod tidy
builds:
  - main: ./cmd/voom
    binary: voom
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/mjrusso/voom/internal/cli.version={{.Version}} -X github.com/mjrusso/voom/internal/cli.commit={{.Commit}} -X github.com/mjrusso/voom/internal/cli.date={{.Date}}
archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Os }}_{{ if eq .Arch "amd64" }}x64{{ else }}{{ .Arch }}{{ end }}
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
checksum:
  name_template: checksums.txt
snapshot:
  version_template: "{{ incpatch .Version }}-next"
release:
  github:
    owner: mjrusso
    name: voom
