version: 2
project_name: voom
before:
  hooks:
    - go mod tidy
    - scripts/prepare-voom-release.sh
    - scripts/prepare-gvproxy-release.sh
    - scripts/prepare-vfkit-release.sh
    - scripts/build-macos-identity.sh .release/native/darwin_arm64/voom-macos-identity
builds:
  - id: voom
    main: ./cmd/voom
    binary: voom
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/mjrusso/voom/internal/buildinfo.Version={{.Version}} -X github.com/mjrusso/voom/internal/buildinfo.Commit={{.Commit}} -X github.com/mjrusso/voom/internal/buildinfo.Date={{.Date}}
  - id: gvproxy
    dir: .release/gvproxy
    main: ./cmd/gvproxy
    binary: gvproxy
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
archives:
  - formats: [tar.gz]
    ids:
      - voom
      - gvproxy
    name_template: >-
      {{ .ProjectName }}_{{ .Os }}_{{ if eq .Arch "amd64" }}x64{{ else }}{{ .Arch }}{{ end }}
    files:
      - LICENSE
      - src: .release/voom-licenses/{{ .Os }}_{{ .Arch }}/**/*
        dst: THIRD_PARTY_LICENSES.voom
      - src: .release/gvproxy/LICENSE
        dst: LICENSE.gvproxy
      - src: nix/NOTICE.gvproxy
        dst: NOTICE.gvproxy
      - src: .release/gvproxy-licenses/{{ .Os }}_{{ .Arch }}/**/*
        dst: THIRD_PARTY_LICENSES
      - src: .release/native/{{ .Os }}_{{ .Arch }}/voom-macos-identity*
        dst: .
        strip_parent: true
      - src: .release/native/{{ .Os }}_{{ .Arch }}/vfkit*
        dst: .
        strip_parent: true
      - src: .release/native/{{ .Os }}_{{ .Arch }}/LICENSE.vfkit*
        dst: .
        strip_parent: true
      - src: .release/native/{{ .Os }}_{{ .Arch }}/NOTICE.vfkit*
        dst: .
        strip_parent: true
      - src: .release/native/{{ .Os }}_{{ .Arch }}/THIRD_PARTY_LICENSES.vfkit/**/*
        dst: THIRD_PARTY_LICENSES.vfkit
      - README.md
      - CHANGELOG.md
      - CONTRIBUTING.md
      - assets/voom.png
      - docs/*.md
      - docs/commands/*.md
      - nix/GVPROXY.md
      - nix/NOTICE.gvproxy
      - nix/NOTICE.vfkit
      - go.mod
      - go.sum
checksum:
  name_template: checksums.txt
snapshot:
  version_template: "{{ incpatch .Version }}-next"
release:
  github:
    owner: mjrusso
    name: voom
